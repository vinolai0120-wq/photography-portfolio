<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="沿途，摄影项目。">
  <title>沿途 / 无人介绍</title>
  <link rel="stylesheet" href="../css/style.css?v=6ccf86b">
  <script src="../js/gallery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="../index.html">无人介绍</a>
    <nav class="site-nav" aria-label="主导航">
      <a class="active" href="../index.html">项目</a>
      <a href="../about.html">关于</a>
    </nav>
  </header>

  <main class="project-page">
    <div class="project-heading">
      <a class="back-link" href="../index.html">← 返回项目</a>
      <div>
        <p class="eyebrow">02 / TRAVEL</p>
        <h1>沿途</h1>
        <p class="project-description">不以抵达为目的的移动，留下了这些画面。</p>
      </div>
      <p class="project-year">2023—2025</p>
    </div>

    <section class="wall-stage" aria-label="沿途画廊墙">
      <div class="wall-topbar">
        <span data-gallery-counter>01 / 03</span>
        <div class="wall-controls" aria-label="切换照片">
          <button class="wall-control" type="button" data-gallery-prev aria-label="上一张">←</button>
          <button class="wall-control" type="button" data-gallery-next aria-label="下一张">→</button>
        </div>
      </div>
      <div class="gallery" aria-label="沿途照片">
        <button class="gallery-image photo-road-01" data-scale="1" data-art-size="84% auto" data-full="../images/along-the-way/01.jpg" data-placeholder="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=86" data-caption="沿途 / 01" aria-label="打开照片 1"><span class="frame-art" aria-hidden="true"></span></button>
        <button class="gallery-image photo-road-02" data-scale="1.08" data-art-size="100% 100%" data-full="../images/along-the-way/02.jpg" data-placeholder="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=86" data-caption="沿途 / 02" aria-label="打开照片 2"><span class="frame-art" aria-hidden="true"></span></button>
        <button class="gallery-image photo-road-03" data-scale=".92" data-art-size="76% auto" data-full="../images/along-the-way/03.jpg" data-placeholder="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=86" data-caption="沿途 / 03" aria-label="打开照片 3"><span class="frame-art" aria-hidden="true"></span></button>
      </div>
      <p class="wall-caption">使用左右键、点击两侧画框或滑动切换。点击中间画框可放大查看。</p>
    </section>
  </main>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="照片预览" hidden>
    <button class="lightbox-close" aria-label="关闭照片预览">×</button>
    <button class="lightbox-prev" aria-label="上一张">←</button>
    <img src="" alt="">
    <button class="lightbox-next" aria-label="下一张">→</button>
    <p class="lightbox-caption"></p>
  </div>
</body>
</html>
