    <path d="M116 112c45-20 78-26 113-15 30 9 48 21 79 18 27-3 49-17 80-16 17 0 34 5 52 13-35 16-64 22-99 20-41-2-64-13-98-8-41 6-74 14-127-12Z" fill="url(#wash-c)"/>
    <path d="M53 151c39 2 61 14 88 26 28 12 49 17 79 14 30-3 50-17 77-21" fill="#337f91" fill-opacity=".19"/>
    <path d="M255 152c28-16 52-26 78-27 29-1 49 8 78 20" fill="#367f9e" fill-opacity=".24"/>
  </g>

