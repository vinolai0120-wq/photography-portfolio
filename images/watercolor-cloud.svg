<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" fill="none">
  <defs>
    <filter id="edge-wash" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.055" numOctaves="3" seed="31" result="paper"/>
      <feDisplacementMap in="SourceGraphic" in2="paper" scale="11" xChannelSelector="R" yChannelSelector="G" result="flow"/>
      <feGaussianBlur in="flow" stdDeviation="3.2"/>
    </filter>
    <filter id="brush-grain" x="-12%" y="-20%" width="124%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.14" numOctaves="2" seed="11" result="tooth"/>
      <feDisplacementMap in="SourceGraphic" in2="tooth" scale="4" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feGaussianBlur in="rough" stdDeviation=".65"/>
    </filter>
    <linearGradient id="wash-a" x1="48" y1="132" x2="480" y2="173" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9dfe0" stop-opacity=".06"/>
      <stop offset=".28" stop-color="#6fb6c6" stop-opacity=".38"/>
      <stop offset=".58" stop-color="#347f9c" stop-opacity=".74"/>
      <stop offset=".84" stop-color="#75b6ba" stop-opacity=".37"/>
      <stop offset="1" stop-color="#c5e0d8" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="wash-b" x1="72" y1="174" x2="450" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a7d5ce" stop-opacity=".16"/>
      <stop offset=".38" stop-color="#438f9c" stop-opacity=".53"/>
      <stop offset=".7" stop-color="#6bb3b2" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d3e8dc" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="wash-c" x1="110" y1="104" x2="418" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4e2df" stop-opacity=".05"/>
      <stop offset=".46" stop-color="#7abcc8" stop-opacity=".31"/>
      <stop offset=".78" stop-color="#478ea7" stop-opacity=".42"/>
      <stop offset="1" stop-color="#d7e9df" stop-opacity=".06"/>
    </linearGradient>
  </defs>

  <!-- Transparent sky pigment, wide and broken rather than cloud-shaped. -->
  <g filter="url(#edge-wash)">
    <path d="M49 145c45-31 85-47 126-39 36 7 56 29 95 28 43-1 73-27 116-27 33 0 61 12 89 31-43 18-87 27-134 26-43-1-70-12-109-9-57 5-102 28-183-10Z" fill="url(#wash-a)"/>
    <path d="M74 178c56-22 98-27 139-13 32 11 56 17 88 9 35-9 61-24 96-22 29 1 54 10 78 22-49 22-91 28-136 23-45-4-74-13-116-5-44 8-88 9-149-14Z" fill="url(#wash-b)"/>
    <path d="M116 112c45-20 78-26 113-15 30 9 48 21 79 18 27-3 49-17 80-16 17 0 34 5 52 13-35 16-64 22-99 20-41-2-64-13-98-8-41 6-74 14-127-12Z" fill="url(#wash-c)"/>
    <path d="M53 151c39 2 61 14 88 26 28 12 49 17 79 14 30-3 50-17 77-21" fill="#337f91" fill-opacity=".19"/>
    <path d="M255 152c28-16 52-26 78-27 29-1 49 8 78 20" fill="#367f9e" fill-opacity=".24"/>
  </g>

  <!-- Distinct, dry-edged brush passes keep painterly texture visible when small. -->
  <g filter="url(#brush-grain)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 139c36-22 67-29 94-20m18 7c28 17 51 22 81 15m19-9c29-17 56-23 81-17m18 7c17 5 31 11 47 20" stroke="#347d99" stroke-width="10" opacity=".76"/>
    <path d="M105 180c32 10 59 13 87 7m29-3c24-8 41-15 65-15m34 3c23 1 41 5 62 12" stroke="#367f8e" stroke-width="9" opacity=".55"/>
    <path d="M121 111c19 2 34 9 48 19m93 12c15-7 27-13 43-16m52 8c13 2 23 7 34 14" stroke="#d9ece3" stroke-width="6" opacity=".72"/>
    <path d="M84 129l17-9m76 66 12 4m110-58 15-8m68 31 13 7" stroke="#2f718c" stroke-width="4" opacity=".55"/>
    <path d="M139 151c15 7 29 10 42 10m96-3c13-5 23-7 35-7" stroke="#b5d8d3" stroke-width="5" opacity=".73"/>
  </g>
</svg>
