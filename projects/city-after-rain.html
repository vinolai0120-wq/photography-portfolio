  <header class="site-header">

  <main class="project-page">
    <div class="project-heading">
      <a class="back-link" href="../index.html">← 返回项目</a>
      <div>
        <p class="eyebrow">01 / CITY</p>
        <h1>雨后的城市</h1>
        <p class="project-description">雨停之后，城市短暂地变得没有方向。</p>
      </div>
      <p class="project-year">2024—2026</p>

    <section class="wall-stage" aria-label="雨后的城市画廊墙">
      <div class="wall-topbar">
        <span data-gallery-counter>01 / 04</span>
        <div class="wall-controls" aria-label="切换照片">
          <button class="wall-control" type="button" data-gallery-prev aria-label="上一张">←</button>
          <button class="wall-control" type="button" data-gallery-next aria-label="下一张">→</button>
        </div>
      </div>
      <div class="gallery" aria-label="雨后的城市照片">
        <button class="gallery-image photo-city-01" data-scale="1.04" data-art-size="82% auto" data-full="../images/city-after-rain/01.jpg" data-placeholder="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1400&q=86" data-caption="雨后的城市 / 01" aria-label="打开照片 1"></button>
        <button class="gallery-image photo-city-02" data-scale=".94" data-art-size="100% 100%" data-full="../images/city-after-rain/02.jpg" data-placeholder="https://images.unsplash.com/photo-1514924013411-cbf25faa35bb?auto=format&fit=crop&w=1400&q=86" data-caption="雨后的城市 / 02" aria-label="打开照片 2"></button>
        <button class="gallery-image photo-city-03" data-scale="1" data-art-size="78% auto" data-full="../images/city-after-rain/03.jpg" data-placeholder="https://images.unsplash.com/photo-1494522358652-f30e61a60313?auto=format&fit=crop&w=1400&q=86" data-caption="雨后的城市 / 03" aria-label="打开照片 3"></button>
        <button class="gallery-image photo-city-04" data-scale=".9" data-art-size="88% auto" data-full="../images/city-after-rain/04.jpg" data-placeholder="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1400&q=86" data-caption="雨后的城市 / 04" aria-label="打开照片 4"></button>
      </div>
      <p class="wall-caption">使用左右键、点击两侧画框或滑动切换。点击中间画框可放大查看。</p>
    </section>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="照片预览" hidden>
    <button class="lightbox-close" aria-label="关闭照片预览">×</button>
    <button class="lightbox-prev" aria-label="上一张">←</button>
