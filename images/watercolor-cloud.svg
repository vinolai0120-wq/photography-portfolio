<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" fill="none">
  <defs>
    <filter id="wash" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.075" numOctaves="2" seed="18" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="7" xChannelSelector="R" yChannelSelector="G" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="2.4"/>
    </filter>
    <filter id="bleed" x="-25%" y="-35%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.09" numOctaves="2" seed="9" result="paper"/>
      <feDisplacementMap in="SourceGraphic" in2="paper" scale="10" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feGaussianBlur in="rough" stdDeviation="5.5"/>
    </filter>
    <filter id="dry" x="-15%" y="-25%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.055 0.16" numOctaves="2" seed="4" result="paper"/>
      <feDisplacementMap in="SourceGraphic" in2="paper" scale="4" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feGaussianBlur in="rough" stdDeviation=".65"/>
    </filter>
  </defs>

  <!-- Loose pale washes extend beyond the stronger brush marks. -->
  <g filter="url(#bleed)" opacity=".5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 111c20-20 42-27 63-24 14 2 24 9 34 15 8-29 30-52 54-51 21 1 35 18 39 40 17-14 35-17 49-8 10 7 16 18 17 29" stroke="#4c9fc1" stroke-width="34"/>
    <path d="M40 125c25-12 49-14 73-7 20 6 35 19 54 19 18 0 27-13 43-17" stroke="#77b888" stroke-width="28"/>
    <path d="M213 111c23-14 43-17 63-9 17 7 30 21 48 23 15 2 28-5 41-11" stroke="#e9aebc" stroke-width="29"/>
  </g>

  <!-- Green underwash, brushed in separate passes. -->
  <g filter="url(#wash)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 119c23-14 46-16 69-9 19 6 34 19 54 19 16 0 27-11 40-16" stroke="#8cc99a" stroke-width="24" opacity=".72"/>
    <path d="M57 126c24 7 43 15 67 14 17 0 28-6 42-12" stroke="#58a873" stroke-width="12" opacity=".62"/>
    <path d="M52 108c13-7 23-9 34-8m67 36c12 4 23 3 33-2" stroke="#4b9c68" stroke-width="5" opacity=".47"/>
    <path d="M74 103c10 1 18 4 26 9" stroke="#b2d9a9" stroke-width="9" opacity=".72"/>
  </g>

  <!-- Blue is the strongest pigment and the main cloud gesture. -->
  <g filter="url(#wash)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 105c19-18 39-25 59-22 15 2 26 10 37 17 8-28 29-48 52-48 21 0 34 18 38 40 17-14 34-16 47-7 10 7 15 17 16 28" stroke="#69b4d1" stroke-width="23" opacity=".84"/>
    <path d="M78 111c20 8 34 18 53 19 17 2 29-6 43-16 16-12 31-18 49-14" stroke="#438fb2" stroke-width="15" opacity=".75"/>
    <path d="M97 78c9 3 17 8 23 14m65-37c9 5 15 14 17 24m43 8c7-2 13-1 18 3" stroke="#2d779b" stroke-width="6" opacity=".55"/>
    <path d="M63 99c7-6 14-10 20-12m144 48c13 3 22 1 31-3" stroke="#a2d3df" stroke-width="7" opacity=".72"/>
    <path d="M113 116c13 5 22 9 34 9" stroke="#276f93" stroke-width="4" opacity=".55"/>
  </g>

  <!-- Blush strokes sit behind and trail off rather than forming a closed lobe. -->
  <g filter="url(#wash)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 111c18-13 36-16 53-9 15 6 27 20 44 23 14 2 26-4 39-11" stroke="#efbdc7" stroke-width="22" opacity=".68"/>
    <path d="M245 122c18 8 34 13 53 10 13-2 23-7 34-14" stroke="#e8a7b6" stroke-width="10" opacity=".52"/>
    <path d="M294 96c9 1 16 5 22 11" stroke="#f4d2d3" stroke-width="8" opacity=".78"/>
  </g>

  <!-- Uneven pigment pooling and dry-brush flecks. -->
  <g filter="url(#dry)" opacity=".32">
    <path d="M58 94l7-4m19-5 5-2m42 19 6 3m25-45 5-5m42 8 4 6m38 23 6-1m28 24 5 2m20 17 7-1" stroke="#286f91" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 139l8 2m35-1 7 2m100-5 8-1m68 10 8-3m30-22 6-3" stroke="#438aa6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Loose blue-gray raindrops, painted as short rounded dashes. -->
  <g filter="url(#wash)" stroke-linecap="round">
    <path d="M91 171l-5 12" stroke="#729db1" stroke-width="7" opacity=".76"/>
    <path d="M145 177l-3 10" stroke="#6e9caf" stroke-width="6" opacity=".68"/>
    <path d="M199 168l-5 13" stroke="#648fa5" stroke-width="7" opacity=".78"/>
    <path d="M253 176l-4 11" stroke="#759fb1" stroke-width="6" opacity=".7"/>
    <path d="M307 166l-5 12" stroke="#648da2" stroke-width="7" opacity=".76"/>
    <path d="M116 207l-4 10" stroke="#7da4b3" stroke-width="6" opacity=".58"/>
    <path d="M224 205l-4 11" stroke="#6b94a7" stroke-width="6" opacity=".65"/>
    <path d="M281 207l-4 9" stroke="#7b9faf" stroke-width="5" opacity=".56"/>
  </g>
</svg>
